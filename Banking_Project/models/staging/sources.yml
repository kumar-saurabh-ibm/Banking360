sources:
  - name: src
    description: "Bank360 raw landing area data"
    database: BANK360_PROJECT
    schema: RAW          

    tables:
      - name: customers
        description: "Customer master records including demographic information and KYC status."

      - name: accounts
        description: "Bank account status details including type, balance, and opening dates."

      - name: transactions
        description: "Financial ledger transactions linked to customer bank accounts."

      - name: cards
        description: "Credit and debit card status tracking, numbers, and expiration windows."

      - name: branches
        description: "Physical operational bank branches, regional zones, and management mapping."

      - name: loans
        description: "Customer loan profiles detailing credit type, principal balances, and interest rates."
